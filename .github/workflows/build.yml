name: build

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Positive evidence, never grep-for-absence. Every gate records its own
      # exit status so a step that silently fails to run cannot pass as clean.
      - name: Formatting
        run: |
          cargo fmt --all --check
          echo "fmt exit=$?"

      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          echo "clippy exit=$?"

      - name: Tests
        run: |
          cargo test --workspace
          echo "tests exit=$?"

  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # This repository is public from the first commit, so the guard runs on
      # every push rather than before a release.
      - name: Scrub check
        run: ./scripts/scrub-check.sh

      - name: Gitleaks over full history
        run: gitleaks detect --redact --no-banner --exit-code 2
