name: build

on:
  push:
    branches: [main]
    # A tag is how a release is asked for. Everything below still runs, so a
    # release is a build that passed the same gates as any other, plus signing.
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Positive evidence, never grep-for-absence. Every gate records its own
      # exit status so a step that silently fails to run cannot pass as clean.
      - name: Formatting
        run: |
          cargo fmt --all --check
          echo "fmt exit=$?"

      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          echo "clippy exit=$?"

      - name: Tests
        run: |
          cargo test --workspace
          echo "tests exit=$?"

  frontend:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Install
        run: npm --prefix frontend install

      # The rule is that nothing in the interface goes unexplained. This is what
      # makes that true rather than aspirational.
      - name: Hint coverage
        run: |
          cd frontend && node scripts/audit-hints.mjs
          echo "hints exit=$?"

      # Types are a gate too: vite build does not check them, and an unchecked
      # gate rots. This failing once stayed failing for weeks unnoticed.
      - name: Type check
        run: |
          npm --prefix frontend run check
          echo "svelte-check exit=$?"

      - name: Build
        run: |
          npm --prefix frontend run build
          echo "frontend build exit=$?"

      - name: Client package
        run: |
          npm --prefix packages/client install
          npx --prefix packages/client tsc -p packages/client/tsconfig.json
          echo "client exit=$?"

  # Everything above can be green while the app that reaches a user cannot open
  # a web page at all: the tests exercise the sidecar from the source tree, and
  # for a long time nothing here ever built a bundle to notice that the sidecar
  # was not being copied into it. So this job builds the real .app, looks inside
  # it, and then drives the copy that is actually in there.
  bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The sidecar installs from its lockfile, because the browser a user gets
      # has to be the playwright-core this was tested against. The frontend uses
      # install rather than ci to match the job above: its lockfile is not
      # tracked yet, and npm ci refuses to run without one.
      - name: Dependencies
        run: |
          npm --prefix frontend install
          echo "frontend deps exit=$?"
          npm --prefix sidecars/browser-agent ci --omit=dev
          echo "sidecar deps exit=$?"

      # The bundler finds externalBin sources by target triple and strips the
      # suffix again inside the app, which is how the daemon lands on
      # Contents/MacOS/errandd, the path core/src/launchd.rs writes into the
      # LaunchAgent.
      - name: Stage the daemon for the bundler
        run: |
          cargo build --release -p errand-runner --bin errandd
          mkdir -p app/binaries
          cp target/release/errandd "app/binaries/errandd-$(rustc -vV | sed -n 's/host: //p')"
          echo "stage exit=$?"

      - name: Build the bundle
        run: |
          cargo install tauri-cli --version "^2" --locked
          cd app && cargo tauri build
          echo "bundle exit=$?"

      # Positive evidence that the pieces are inside the app, named one at a
      # time so a failure says which one is missing.
      - name: The sidecar is really in the bundle
        run: |
          APP="target/release/bundle/macos/Errand-AI.app"
          test -f "$APP/Contents/Resources/browser-agent/src/main.mjs"
          echo "sidecar script exit=$?"
          test -f "$APP/Contents/Resources/browser-agent/node_modules/playwright-core/package.json"
          echo "playwright-core exit=$?"
          test -x "$APP/Contents/MacOS/errandd"
          echo "daemon exit=$?"

      # A file being present is not the same as the sidecar working, and the
      # failure this job exists to catch was a browser that could not launch on
      # a machine that had never run Playwright. So talk to the bundled copy.
      - name: The bundled sidecar answers
        run: |
          SIDECAR="target/release/bundle/macos/Errand-AI.app/Contents/Resources/browser-agent/src/main.mjs"
          printf '%s\n' '{"id":1,"method":"ping"}' | node "$SIDECAR" | tee /tmp/ping.ndjson
          grep -q '"pong":true' /tmp/ping.ndjson
          echo "ping exit=$?"

      - name: The bundled sidecar opens a real page
        run: |
          cat > /tmp/smoke.mjs <<'SMOKE'
          // Speaks the sidecar's NDJSON-RPC the way runner/src/browser.rs does.
          import { spawn } from 'node:child_process';
          const child = spawn(process.execPath, [process.argv[2]], {
            stdio: ['pipe', 'pipe', 'inherit'],
          });
          const waiting = new Map();
          let buf = '';
          child.stdout.on('data', (c) => {
            buf += c;
            let i;
            while ((i = buf.indexOf('\n')) >= 0) {
              const line = buf.slice(0, i);
              buf = buf.slice(i + 1);
              if (!line.trim()) continue;
              console.log('<-', line.slice(0, 400));
              let msg;
              try { msg = JSON.parse(line); } catch { continue; }
              if (msg.id && waiting.has(msg.id)) {
                waiting.get(msg.id)(msg);
                waiting.delete(msg.id);
              }
            }
          });
          let nextId = 0;
          function call(method, params = {}) {
            const id = ++nextId;
            return new Promise((resolve, reject) => {
              const t = setTimeout(() => reject(new Error(`no reply to ${method} within 90s`)), 90000);
              waiting.set(id, (m) => {
                clearTimeout(t);
                if (m.error) reject(new Error(m.error.message));
                else resolve(m.result);
              });
              child.stdin.write(JSON.stringify({ id, method, params }) + '\n');
            });
          }
          const probe = await call('browser.probe');
          if (!probe.found) throw new Error(probe.message);
          console.log('browser found:', probe.name);
          const opened = await call('session.open', {
            profile_dir: '/tmp/errand-ci-profile',
            headless: true,
            allowed_domains: ['example.com'],
          });
          console.log('session opened with:', opened.browser);
          const page = await call('page.goto', { url: 'https://example.com/' });
          if (!/example domain/i.test(page.title || '')) {
            throw new Error(`unexpected page title: ${JSON.stringify(page.title)}`);
          }
          console.log('page title:', page.title);
          await call('session.close', {});
          child.stdin.end();
          SMOKE
          node /tmp/smoke.mjs "target/release/bundle/macos/Errand-AI.app/Contents/Resources/browser-agent/src/main.mjs"
          echo "smoke exit=$?"

  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # This repository is public from the first commit, so the guard runs on
      # every push rather than before a release.
      - name: Scrub check
        run: ./scripts/scrub-check.sh

      - name: Gitleaks over full history
        run: gitleaks detect --redact --no-banner --exit-code 2

  # ---------------------------------------------------------------- release --
  #
  # Only on a tag, and only after everything above has passed: a release is an
  # ordinary build that also gets signed, notarised and published.
  #
  # Signing and notarisation need secrets that belong to a person, and a fork or
  # a first-time setup will not have them. So each is skipped rather than fatal,
  # and the job says which one it skipped. An unsigned build is still a build;
  # it just makes macOS ask the person to allow it, which is the honest outcome
  # of not having set the secrets up.
  #
  # The five secrets, once, in the repository's settings:
  #   MACOS_CERTIFICATE          base64 of a Developer ID Application .p12
  #   MACOS_CERTIFICATE_PASSWORD the password that .p12 was exported with
  #   APPLE_ID                   the Apple ID that owns the certificate
  #   APPLE_PASSWORD             an app-specific password, not the real one
  #   APPLE_TEAM_ID              the ten-character team id
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, frontend, bundle, scrub]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Dependencies
        run: |
          npm --prefix frontend install
          npm --prefix sidecars/browser-agent ci --omit=dev

      # The version in the tag and the version in the manifest have to agree, or
      # the file somebody downloads is named after a release it is not.
      - name: The tag matches the app version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          APP=$(python3 -c "import json;print(json.load(open('app/tauri.conf.json'))['version'])")
          test "$TAG" = "$APP" || {
            echo "tag $GITHUB_REF_NAME does not match app version $APP" >&2
            exit 1
          }
          echo "version $APP"

      - name: Unlock a signing certificate
        id: signing
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERT" ]; then
            echo "no certificate secret, so this build will not be signed"
            echo "signed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A keychain of its own, thrown away with the runner. Never the login
          # keychain, which on a shared runner is not ours to touch.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASSWORD=$(uuidgen)
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -m1 "Developer ID Application" | sed -E 's/.*"(.*)"/\1/')
          test -n "$IDENTITY" || { echo "the certificate is not a Developer ID Application" >&2; exit 1; }
          echo "signing as: $IDENTITY"
          echo "signed=yes" >> "$GITHUB_OUTPUT"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Stage the daemon for the bundler
        run: |
          cargo build --release -p errand-runner --bin errandd
          mkdir -p app/binaries
          cp target/release/errandd "app/binaries/errandd-$(rustc -vV | sed -n 's/host: //p')"

      # Notarisation happens here rather than as a step of its own: the Tauri
      # bundler signs the app, the sidecar and the daemon in the right order and
      # then submits, which hand-rolled codesign calls get wrong by signing the
      # outside before the inside.
      - name: Build, sign and notarise
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cargo install tauri-cli --version "^2" --locked
          if [ -z "$APPLE_ID" ]; then
            echo "no Apple ID secret, so this build will not be notarised"
            echo "macOS will warn the person who opens it until it is"
          fi
          cd app && cargo tauri build

      # Said out loud, because "it built" and "it is signed" are different
      # facts and only one of them decides whether a stranger can open it.
      - name: What this build actually is
        run: |
          APP="target/release/bundle/macos/Errand-AI.app"
          codesign -dv --verbose=2 "$APP" 2>&1 | sed -n '1,6p' || true
          if codesign --verify --deep --strict "$APP" 2>/dev/null; then
            echo "signature: valid"
          else
            echo "signature: NONE (macOS will warn on first open)"
          fi
          if xcrun stapler validate "$APP" 2>/dev/null; then
            echo "notarised: yes"
          else
            echo "notarised: no"
          fi

      # The daemon inside the bundle is what the app installs as a LaunchAgent,
      # so a release that ships without it is a release that cannot do anything.
      - name: The daemon is really in the release
        run: |
          APP="target/release/bundle/macos/Errand-AI.app"
          test -x "$APP/Contents/MacOS/errandd"
          test -f "$APP/Contents/Resources/browser-agent/src/main.mjs"
          echo "daemon and sidecar present"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/dmg/*.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
